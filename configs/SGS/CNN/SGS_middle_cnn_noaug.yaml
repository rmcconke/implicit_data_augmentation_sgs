task_name: middle_boxfilter_4x_sgs
task_type: sgs # 'sr' or 'sgs'
batch_size: 256
eval_batch_size: 128
rotation_batch_size: 1
epochs: 3000
loss_type: 'L2' # 'L1' or 'L2'
learning_rate: 0.0008
save_interval: 100
early_stopping_patience: 100000000
validation_interval: 20
memorization_test: False
track_oct_equivariance_error: False
track_so3_equivariance_error: False
train_aug_group: null
val_aug_group: null
test_aug_group: null
seed: 42
test_after_training: True

dataset:
  input_prefix: channel_middle_grad_fs4
  target_prefix: channel_middle_sgs_fs4
  train_box: [0] # e.g. [0]
  train_samples: 'all' # e.g. 1, 10, 20, or 'all'. Subsamples the training portion of the time series.
  val_box: [1] # e.g. [0]
  val_samples: 50
  test_box: [2] # e.g. [0]
  test_samples: 50 #'all'
  sampling_method: 'random' # 'random' or 'sequential', only applies if time_samples is not 'all'. Sequential starts from 0
  additional_test_datasets:
    Re5200_middle:
      input_prefix: channel5200_middle_grad_fs4
      target_prefix: channel5200_middle_sgs_fs4
    Re5200_nearwall:
      input_prefix: channel5200_nearwall_grad_fs4
      target_prefix: channel5200_nearwall_sgs_fs4

model:
  # model_type: sgsMLP
  # input_channels: 9
  # output_channels: 6
  # layers: [128, 128, 128]
  model_type: sgsCNN
  is_3d: True
  continuous_group: False
  input_channels: 9
  output_channels: 6
  hidden_channels: [16,16,16]
  kernel_size: 3